<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vencimientos SSL - Panel de Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header / Navbar -->
  <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-shield-halved text-emerald-400 text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">Monitor SSL</h1>
      </div>
      <div class="flex items-center space-x-4">
        <span id="adminStatusBadge" class="text-xs px-2.5 py-1 rounded-full font-semibold bg-slate-700 text-slate-400">
          Modo Lectura
        </span>
        <button id="adminBtn" onclick="alternarModoAdmin()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition duration-200 shadow">
          <i class="fa-solid fa-lock mr-2"></i>Acceso Admin
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl w-full mx-auto p-6 space-y-6">

    <!-- Panel de Administración (Agregar Dominio) -->
    <div id="adminPanel" class="hidden bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
      <h2 class="text-lg font-semibold mb-3 text-slate-200">Agregar Nuevo Dominio</h2>
      <form id="addDomainForm" onsubmit="agregarDominio(event)" class="flex gap-3">
        <input type="text" id="domainInput" placeholder="ejemplo.com" required
          class="flex-grow bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-slate-100 focus:outline-none focus:border-indigo-500 transition">
        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg font-medium transition shadow">
          <i class="fa-solid fa-plus mr-2"></i>Agregar
        </button>
      </form>
    </div>

    <!-- Acciones Globales -->
    <div class="flex justify-between items-center">
      <p class="text-slate-400 text-sm">Mostrando dominios monitoreados</p>
      <button onclick="verificarTodos()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm transition">
        <i class="fa-solid fa-rotate mr-2"></i>Actualizar Todos
      </button>
    </div>

    <!-- Tabla de Dominios -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-lg">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/50 text-slate-400 uppercase text-xs border-b border-slate-700">
            <tr>
              <th scope="col" class="py-3 px-4">Dominio</th>
              <th scope="col" class="py-3 px-4">Fecha Vencimiento</th>
              <th scope="col" class="py-3 px-4">Días Restantes</th>
              <th scope="col" class="py-3 px-4">Estado</th>
              <th scope="col" class="py-3 px-4 text-right">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaDominios" class="divide-y divide-slate-700/50">
            <!-- Filas generadas dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- JavaScript Script -->
  <script>
    // Configuración de la API en Render
    const API_BASE_URL = "https://py-server-ssl.onrender.com";

    // Dominios por defecto
    const dominiosPredeterminados = ["google.com", "github.com", "render.com"];

    // Estado local
    let listaDominios = JSON.parse(localStorage.getItem('ssl_dominios')) || dominiosPredeterminados;
    let esAdmin = sessionStorage.getItem('ssl_admin_active') === 'true';

    // Al cargar la página
    document.addEventListener("DOMContentLoaded", () => {
      actualizarInterfazModo();
      renderTabla();
      verificarTodos();
    });

    // Guardar cambios en LocalStorage
    function guardarDominios() {
      localStorage.setItem('ssl_dominios', JSON.stringify(listaDominios));
    }

    // Cambiar Modo Administrador conectando con backend en Python
    async function alternarModoAdmin() {
      if (esAdmin) {
        if (confirm('¿Deseas salir del modo administración?')) {
          sessionStorage.removeItem('ssl_admin_active');
          esAdmin = false;
          actualizarInterfazModo();
          renderTabla();
        }
      } else {
        const pass = prompt('Ingresa la contraseña de administración:');
        if (!pass) return;

        try {
          const response = await fetch(`${API_BASE_URL}/verify-admin`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pass })
          });

          const result = await response.json();

          if (result.success) {
            sessionStorage.setItem('ssl_admin_active', 'true');
            esAdmin = true;
            actualizarInterfazModo();
            renderTabla();
          } else {
            alert('Contraseña incorrecta.');
          }
        } catch (error) {
          alert('Error al conectar con el servidor de autenticación.');
          console.error('Error:', error);
        }
      }
    }

    // Actualizar UI según el rol (Admin / Lectura)
    function actualizarInterfazModo() {
      const badge = document.getElementById('adminStatusBadge');
      const btn = document.getElementById('adminBtn');
      const panel = document.getElementById('adminPanel');

      if (esAdmin) {
        badge.textContent = 'Modo Admin';
        badge.className = 'text-xs px-2.5 py-1 rounded-full font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
        btn.innerHTML = '<i class="fa-solid fa-lock-open mr-2"></i>Salir Admin';
        btn.className = 'bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition duration-200';
        panel.classList.remove('hidden');
      } else {
        badge.textContent = 'Modo Lectura';
        badge.className = 'text-xs px-2.5 py-1 rounded-full font-semibold bg-slate-700 text-slate-400';
        btn.innerHTML = '<i class="fa-solid fa-lock mr-2"></i>Acceso Admin';
        btn.className = 'bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition duration-200 shadow';
        panel.classList.add('hidden');
      }
    }

    // Renderizar la tabla principal
    function renderTabla() {
      const tbody = document.getElementById('tablaDominios');
      tbody.innerHTML = '';

      listaDominios.forEach((dom) => {
        const tr = document.createElement('tr');
        tr.id = `domain-row-${dom.replace(/[^a-zA-Z0-9]/g, '_')}`;
        tr.className = 'hover:bg-slate-700/30 transition';

        tr.innerHTML = `
          <td class="py-3 px-4 font-medium text-slate-100">${dom}</td>
          <td class="py-3 px-4 fecha-val">Consultando...</td>
          <td class="py-3 px-4 dias-val">-</td>
          <td class="py-3 px-4 estado-val">
            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-700 text-slate-300">
              Cargando
            </span>
          </td>
          <td class="py-3 px-4 text-right space-x-2">
            <button onclick="verificarSSL('${dom}')" title="Revisar" class="text-slate-400 hover:text-indigo-400 transition">
              <i class="fa-solid fa-arrows-rotate"></i>
            </button>
            ${esAdmin ? `
              <button onclick="eliminarDominio('${dom}')" title="Eliminar" class="text-slate-400 hover:text-rose-400 transition">
                <i class="fa-solid fa-trash"></i>
              </button>
            ` : ''}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Consultar SSL de un dominio específico
    async function verificarSSL(dominio) {
      const rowId = `domain-row-${dominio.replace(/[^a-zA-Z0-9]/g, '_')}`;
      const row = document.getElementById(rowId);
      if (!row) return;

      const fechaCell = row.querySelector('.fecha-val');
      const diasCell = row.querySelector('.dias-val');
      const estadoCell = row.querySelector('.estado-val');

      fechaCell.textContent = '...';
      diasCell.textContent = '...';

      try {
        const res = await fetch(`${API_BASE_URL}/check-ssl?domain=${encodeURIComponent(dominio)}`);
        const data = await res.json();

        if (data.error) {
          fechaCell.textContent = 'N/D';
          diasCell.textContent = 'N/D';
          estadoCell.innerHTML = `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-rose-500/20 text-rose-400 border border-rose-500/30">Error</span>`;
          return;
        }

        fechaCell.textContent = data.vence;
        diasCell.textContent = `${data.diasRestantes} días`;

        // Indicador dinámico por días restantes
        if (data.diasRestantes <= 15) {
          estadoCell.innerHTML = `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-rose-500/20 text-rose-400 border border-rose-500/30">Crítico</span>`;
        } else if (data.diasRestantes <= 30) {
          estadoCell.innerHTML = `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-amber-500/20 text-amber-400 border border-amber-500/30">Próximo</span>`;
        } else {
          estadoCell.innerHTML = `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Válido</span>`;
        }

      } catch (err) {
        fechaCell.textContent = 'N/D';
        diasCell.textContent = 'N/D';
        estadoCell.innerHTML = `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-rose-500/20 text-rose-400 border border-rose-500/30">Desconectado</span>`;
      }
    }

    // Verificar todos los dominios
    function verificarTodos() {
      listaDominios.forEach(dom => verificarSSL(dom));
    }

    // Agregar dominio (Solo Admin)
    function agregarDominio(e) {
      e.preventDefault();
      const input = document.getElementById('domainInput');
      const nuevoDominio = input.value.trim().toLowerCase();

      if (nuevoDominio && !listaDominios.includes(nuevoDominio)) {
        listaDominios.push(nuevoDominio);
        guardarDominios();
        renderTabla();
        verificarSSL(nuevoDominio);
        input.value = '';
      }
    }

    // Eliminar dominio (Solo Admin)
    function eliminarDominio(dominio) {
      if (confirm(`¿Eliminar ${dominio} de la lista?`)) {
        listaDominios = listaDominios.filter(d => d !== dominio);
        guardarDominios();
        renderTabla();
        verificarTodos();
      }
    }
  </script>
</body>
</html>
